services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: aquasentry
      POSTGRES_PASSWORD: aquasentry
      POSTGRES_DB: aquasentry
    ports:
      - "5433:5432"
    volumes:
      - aquasentry_pg:/var/lib/postgresql/data
      - ./packages/agents/src/aquasentry_agents/spatial.sql:/docker-entrypoint-initdb.d/10-spatial.sql:ro

volumes:
  aquasentry_pg:
