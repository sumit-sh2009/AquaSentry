[project]
name = "aquasentry"
version = "0.1.0"
description = "Hydro-toxicology sentinel for lead service lines and PFAS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aquasentry-api",
    "aquasentry-agents",
    "aquasentry-mcp",
]

[tool.uv]
package = false

[tool.uv.sources]
aquasentry-api = { workspace = true }
aquasentry-agents = { workspace = true }
aquasentry-mcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/agents", "packages/api", "packages/mcp_tools"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
