[project]
name = "aquasentry-mcp"
version = "0.1.0"
description = "FastMCP tools and fixture catalog for SDWIS, USGS, and LCRI"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.28",
]

[project.scripts]
aquasentry-mcp = "aquasentry_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
