[project]
name = "aquasentry-agents"
version = "0.1.0"
description = "LangGraph workers and toxicological evaluator for AquaSentry"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "aquasentry-mcp",
]

[tool.uv.sources]
aquasentry-mcp = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
