<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Check a Newark tap against the lead action level and the PFOA/PFOS MCL. A utility average does not certify a sample as safe."
    />
    <meta name="theme-color" content="#ccd5ae" />
    <title>AquaSentry — Newark watershed</title>
    <script>
      try {
        var stored = localStorage.getItem("aquasentry-theme")
        if (stored !== "dark" && stored !== "light") {
          stored = "light"
          localStorage.setItem("aquasentry-theme", "light")
        }
        document.documentElement.classList.remove("light", "dark")
        document.documentElement.classList.add(stored)
        document.documentElement.style.colorScheme = stored
        if (stored === "dark") {
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", "#01472e")
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
